[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harvey-local-sales-agent"
version = "0.4.0"
description = "A local, multi-product AI sales agent powered by Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
keywords = ["sales", "outreach", "ai-agent", "prospecting", "ollama", "langgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
# Keep in sync with requirements.txt (used by Docker builds).
dependencies = [
    "pyyaml>=6.0.1,<7",
    "python-dotenv>=1.0.1,<2",
    "httpx>=0.27.0,<1",
    "playwright>=1.40,<2",
    "beautifulsoup4>=4.12.3,<5",
    "dnspython>=2.4.2,<3",
    "aiosmtplib>=5.1.3,<6",
    "aiosqlite>=0.19,<1",
    "keyring>=25,<26",
    # The menu-bar app (sellbird tray): macOS and Windows only.
    'pystray>=0.19.5,<0.20; sys_platform == "darwin" or sys_platform == "win32"',
    'Pillow>=10,<12; sys_platform == "darwin" or sys_platform == "win32"',
    "pydantic>=2.5,<3",
    "pytz>=2024.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "langchain>=0.3,<2",
    "langchain-community>=0.3,<1",
    "langchain-ollama>=0.2,<2",
    "langgraph>=0.2,<1",
    "scrapy>=2.11,<3",
    "sentence-transformers>=3.0,<6",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
]

[project.urls]
Homepage = "https://github.com/ethanplusai/sellbird"
Issues = "https://github.com/ethanplusai/sellbird/issues"
Changelog = "https://github.com/ethanplusai/sellbird/blob/main/CHANGELOG.md"

[project.scripts]
harvey-local = "scripts.run_api:main"

[tool.setuptools.packages.find]
include = ["backend*", "graph*", "llm*", "scripts*"]

# The editable defaults an installed app seeds its home folder from
# (sellbird/home.py). They land in <prefix>/share/sellbird.
[tool.setuptools]
data-files = {"share/sellbird" = ["sellbird.yaml", ".env.example"], "share/sellbird/prompts" = ["prompts/*.md"], "share/sellbird/skills" = ["skills/*.md"]}

# The dashboard's HTML/CSS/JS are real files served from disk, and its fonts
# are vendored so a local tool renders correctly with the network off.
[tool.setuptools.package-data]
sellbird = ["web/*", "web/fonts/*"]
